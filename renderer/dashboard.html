<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대시보드</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
    .slot-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .slot-time { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .slot-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; min-height: 44px; }
    .slot-empty { color: var(--muted); font-size: 14px; }
    .mode-btns { display: flex; gap: 12px; margin-bottom: 24px; }
    .mode-btns .btn { flex: 1; justify-content: center; padding: 14px; font-size: 15px; }
    .keywords-wrap { margin-bottom: 0; }
    .keywords-title { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .keywords-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .keyword-chip {
      padding: 6px 14px; border-radius: 20px;
      background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.3);
      color: var(--accent); font-size: 13px; cursor: pointer; transition: all 0.15s;
    }
    .keyword-chip:hover { background: rgba(59,130,246,0.25); }
    .section-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }

    /* Auto mode */
    .auto-card { border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; background: var(--surface); margin-bottom: 24px; }
    .auto-card.active { border-color: #22c55e; background: rgba(34,197,94,0.05); }
    .auto-toggle {
      padding: 6px 18px; border-radius: 20px; font-size: 13px; font-weight: 700;
      cursor: pointer; border: none; transition: all 0.2s;
    }
    .auto-toggle.on  { background: #22c55e; color: #fff; }
    .auto-toggle.off { background: var(--border); color: var(--muted); }
    .slot-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .slot-info {
      flex: 1; min-width: 140px; padding: 10px 14px; border-radius: 8px;
      background: var(--bg); border: 1px solid var(--border); font-size: 12px;
    }
    .slot-info .slot-time-lbl { font-weight: 700; font-size: 13px; margin-bottom: 3px; }
    .slot-info .slot-next { color: var(--muted); margin-top: 2px; }
  </style>
</head>
<body>
  <nav>
    <span class="nav-brand">📝 블로그 자동화</span>
    <div class="nav-links">
      <button class="active" onclick="api.navigate('dashboard')">대시보드</button>
      <button onclick="api.navigate('write')">글쓰기</button>
      <button onclick="api.navigate('history')">발행 이력</button>
      <button onclick="api.navigate('settings')">설정</button>
    </div>
  </nav>

  <main>
    <div class="mode-btns">
      <button class="btn btn-primary" onclick="api.navigate('write')">⚡ 반자동 모드</button>
      <button class="btn btn-outline" onclick="api.navigate('settings')">⚙️ 발행 시간 설정</button>
    </div>

    <!-- 완전자동 모드 카드 -->
    <div class="auto-card" id="autoCard">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div>
          <div style="font-size:15px; font-weight:700;">🤖 완전자동 모드</div>
          <div style="font-size:12px; color:var(--muted); margin-top:3px;">설정 시간에 자동으로 글을 생성하고 네이버에 발행합니다</div>
        </div>
        <button class="auto-toggle off" id="autoToggleBtn" onclick="toggleAutoMode()">OFF</button>
      </div>
      <div class="slot-row" id="slotRow">
        <div class="slot-info"><div class="slot-time-lbl">🌅 아침</div><div id="slotMorning">-</div><div class="slot-next" id="slotMorningNext"></div></div>
        <div class="slot-info"><div class="slot-time-lbl">☀️ 점심</div><div id="slotLunch">-</div><div class="slot-next" id="slotLunchNext"></div></div>
        <div class="slot-info"><div class="slot-time-lbl">🌆 저녁</div><div id="slotEvening">-</div><div class="slot-next" id="slotEveningNext"></div></div>
      </div>
    </div>

    <p class="section-title">오늘의 발행 현황</p>
    <div class="slot-grid" id="slotGrid">
      <div class="slot-card">
        <div class="slot-time">🌅 아침 (09:00)</div>
        <div class="slot-title slot-empty">비어있음</div>
      </div>
      <div class="slot-card">
        <div class="slot-time">☀️ 점심 (12:00)</div>
        <div class="slot-title slot-empty">비어있음</div>
      </div>
      <div class="slot-card">
        <div class="slot-time">🌆 저녁 (18:00)</div>
        <div class="slot-title slot-empty">비어있음</div>
      </div>
    </div>

    <div class="card keywords-wrap">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
        <div class="keywords-title" id="keywordsLabel" style="margin-bottom:0;">🔥 트렌딩 키워드</div>
        <button id="keywordsRefreshBtn" class="btn btn-outline btn-sm" onclick="loadKeywords(true)" style="font-size:11px; padding:4px 10px;">🔄 새로고침</button>
      </div>
      <div class="keywords-list" id="keywordsList"></div>
    </div>
  </main>

  <div id="toast"></div>
  <script src="js/dashboard.js"></script>
</body>
</html>
