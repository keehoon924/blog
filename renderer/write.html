<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>글쓰기</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .write-layout { display: grid; grid-template-columns: 340px 1fr; gap: 20px; height: calc(100vh - 56px - 48px); }
    .panel-left { display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
    .panel-right { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .step-badge { display: inline-block; background: var(--accent); color: #fff; border-radius: 50%; width: 22px; height: 22px; text-align: center; line-height: 22px; font-size: 12px; font-weight: 700; margin-right: 6px; }
    .card-title { font-size: 14px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; }
    .result-area { flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .result-area textarea { flex: 1; min-height: 300px; font-size: 14px; line-height: 1.7; }
    .action-bar { display: flex; gap: 10px; flex-wrap: wrap; }
    .style-select { display: flex; gap: 8px; }
    .style-btn {
      flex: 1; padding: 8px; border: 1px solid var(--border);
      border-radius: 8px; background: transparent; color: var(--muted);
      cursor: pointer; font-size: 13px; transition: all 0.15s;
    }
    .style-btn.selected { border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,0.1); }
    #statusMsg { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; min-height: 22px; }
    .title-input { font-size: 16px; font-weight: 600; }
    select.form-select {
      width: 100%; padding: 9px 12px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--surface); color: var(--text);
      font-size: 13px; cursor: pointer;
    }
    select.form-select:focus { border-color: var(--accent); outline: none; }
    .seo-bar { display: flex; align-items: center; gap: 10px; font-size: 12px; }
    .seo-score {
      display: none; padding: 2px 10px; border-radius: 12px;
      font-size: 12px; font-weight: 700;
    }
    .seo-score.good { display: inline; background: rgba(34,197,94,0.2); color: #22c55e; }
    .seo-score.medium { display: inline; background: rgba(251,191,36,0.2); color: #f59e0b; }
    .seo-score.low { display: inline; background: rgba(239,68,68,0.2); color: #ef4444; }
    .hashtag-area {
      display: none; padding: 10px 12px; background: rgba(59,130,246,0.08);
      border: 1px solid rgba(59,130,246,0.2); border-radius: 8px;
      font-size: 12px; color: var(--muted); line-height: 1.8;
    }
    .hashtag-area.visible { display: block; }
    .url-input-row { display: flex; gap: 8px; margin-top: 8px; }
    .url-input-row input { flex: 1; font-size: 12px; }
  </style>
</head>
<body>
  <nav>
    <span class="nav-brand">📝 블로그 자동화</span>
    <div class="nav-links">
      <button onclick="api.navigate('dashboard')">대시보드</button>
      <button class="active">글쓰기</button>
      <button onclick="api.navigate('history')">발행 이력</button>
      <button onclick="api.navigate('settings')">설정</button>
    </div>
  </nav>

  <main>
    <div class="write-layout">
      <!-- LEFT: Controls -->
      <div class="panel-left">
        <div class="card">
          <div class="card-title"><span class="step-badge">1</span> 카테고리 선택</div>
          <select class="form-select" id="categorySelect" onchange="onCategoryChange()">
            <option value="daily">일상/라이프</option>
            <option value="recipe">요리/레시피</option>
            <option value="restaurant">맛집</option>
            <option value="economy">경제/정보</option>
            <option value="book">책/문학</option>
            <option value="car">자동차</option>
            <option value="pet">애완동물</option>
            <option value="sports">스포츠</option>
            <option value="other">기타/정보</option>
          </select>
        </div>

        <div class="card">
          <div class="card-title"><span class="step-badge">2</span> 핵심 검색어 / 장소명 <span style="color:var(--accent);font-size:11px;">필수</span></div>
          <div class="form-group">
            <input type="text" id="keywordInput" placeholder="키워드 또는 가게·장소명 입력" />
            <p style="font-size:11px; color:var(--muted); margin-top:6px;" id="keywordHint">예: 성수동 맛집 / 현대 아이오닉5 / 청년 전세 대출</p>
          </div>
        </div>

        <div class="card">
          <div class="card-title"><span class="step-badge">3</span> 원하는 글 내용 <span style="color:var(--muted);font-size:11px;">선택 (비우면 AI 자동 결정)</span></div>
          <div class="form-group">
            <textarea id="promptInput" rows="5" style="font-size:12px; line-height:1.6; resize:vertical;" placeholder="예: 2025년 청년 전세 대출 조건 바뀐 내용으로, 30대 직장인 입장에서 지금 해야 할 것 위주로 써줘. 말투는 친근하게."></textarea>
            <p style="font-size:11px; color:var(--muted); margin-top:6px;">ChatGPT한테 말하듯 자유롭게 — 대상, 말투, 포인트 등 직접 지정 가능</p>
          </div>
        </div>

        <div class="card">
          <div class="card-title"><span class="step-badge">4</span> 글 생성</div>
          <button class="btn btn-primary" style="width:100%; justify-content:center;" id="generateBtn" onclick="handleGenerate()">
            ✨ AI 글 생성
          </button>
        </div>

        <div class="card">
          <div class="card-title"><span class="step-badge">5</span> AI 이미지 생성 <span style="color:var(--muted);font-size:11px;">선택</span></div>
          <div class="style-select" style="margin-bottom:8px;">
            <button class="style-btn selected" data-imgstyle="blog" onclick="selectImgStyle(this)">🖼️ 블로그용</button>
            <button class="style-btn" data-imgstyle="card" onclick="selectImgStyle(this)">📰 카드뉴스</button>
          </div>
          <button class="btn btn-outline" style="width:100%; justify-content:center;" id="imgGenBtn" onclick="handleGenerateImage()" disabled>
            🎨 이미지 생성
          </button>
          <div id="imagePreview" style="margin-top:10px; display:none;">
            <img id="previewImg" style="width:100%; border-radius:8px; border:1px solid var(--border);" />
            <div style="display:flex; gap:6px; margin-top:6px;">
              <span id="imgFilename" style="font-size:11px; color:var(--muted); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
              <button class="btn btn-outline btn-sm" onclick="api.openImageFolder()" style="flex-shrink:0;">📁 폴더</button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title"><span class="step-badge">6</span> AI 감지 우회</div>
          <button class="btn btn-outline" style="width:100%; justify-content:center;" id="humanizeBtn" onclick="handleHumanize()" disabled>
            🔄 자연스럽게 다듬기
          </button>
          <p style="font-size:12px; color:var(--muted); margin-top:8px;">생성 후 클릭하면 더 자연스러운 문체로 변환</p>
        </div>

        <div class="card">
          <div class="card-title"><span class="step-badge">7</span> 네이버 발행</div>
          <button class="btn btn-success" style="width:100%; justify-content:center;" id="publishBtn" onclick="handlePublish()" disabled>
            🚀 네이버에 올리기
          </button>
          <p style="font-size:12px; color:var(--muted); margin-top:8px;">클릭하면 네이버 에디터가 열리고 글+해시태그가 자동 입력됩니다</p>
          <div class="url-input-row" id="urlInputRow" style="display:none;">
            <input type="text" id="naverUrlInput" placeholder="발행 후 URL 입력 (예: https://blog.naver.com/...)" />
            <button class="btn btn-outline btn-sm" onclick="handleSaveUrl()">저장</button>
          </div>
        </div>
      </div>

      <!-- RIGHT: Content -->
      <div class="panel-right">
        <div class="seo-bar">
          <div id="statusMsg"></div>
          <span id="seoScore" class="seo-score"></span>
        </div>
        <div class="result-area">
          <input type="text" class="title-input" id="titleInput" placeholder="제목이 여기에 생성됩니다..." />
          <textarea id="contentInput" placeholder="본문이 여기에 생성됩니다...&#10;&#10;키워드와 카테고리를 선택하고 'AI 글 생성'을 클릭해보세요."></textarea>
          <div class="hashtag-area" id="hashtagArea"></div>
        </div>
        <div class="action-bar">
          <button class="btn btn-outline btn-sm" onclick="handleSaveDraft()">💾 초안 저장</button>
          <button class="btn btn-outline btn-sm" onclick="clearContent()">🗑 초기화</button>
        </div>
      </div>
    </div>
  </main>

  <div id="toast"></div>
  <script src="js/write.js"></script>
</body>
</html>
