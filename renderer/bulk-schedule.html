<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>일괄 예약 발행</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body { height: 100%; overflow-y: auto; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f5f6fa; margin: 0; padding: 0; }

    .top-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 24px; background: #fff;
      border-bottom: 1px solid #e9ecef;
    }
    .top-bar h1 { font-size: 17px; font-weight: 700; margin: 0; color: #1a1a2e; }
    .btn-back {
      background: none; border: none; cursor: pointer;
      font-size: 20px; color: #555; padding: 0;
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }

    /* ── 업로드 영역 ── */
    .upload-zone {
      border: 2px dashed #b0b8c9; border-radius: 14px;
      background: #fff; padding: 40px; text-align: center;
      cursor: pointer; transition: border-color .2s, background .2s;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: #4f8ef7; background: #f0f5ff;
    }
    .upload-zone .icon { font-size: 42px; margin-bottom: 10px; }
    .upload-zone p { color: #667; margin: 6px 0; font-size: 14px; }
    .upload-zone strong { color: #333; font-size: 16px; }
    #file-input { display: none; }

    .btn-upload {
      display: inline-block; margin-top: 16px;
      padding: 10px 28px; background: #4f8ef7; color: #fff;
      border: none; border-radius: 8px; cursor: pointer;
      font-size: 14px; font-weight: 600;
    }

    /* ── 요약 카드 ── */
    .summary-bar {
      display: flex; gap: 16px; margin: 24px 0;
    }
    .summary-card {
      flex: 1; background: #fff; border-radius: 12px;
      padding: 18px 22px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
      text-align: center;
    }
    .summary-card .num { font-size: 28px; font-weight: 700; color: #4f8ef7; }
    .summary-card .label { font-size: 13px; color: #888; margin-top: 4px; }

    /* ── 글 목록 테이블 ── */
    .table-wrap {
      background: #fff; border-radius: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06); overflow: hidden;
      margin-bottom: 24px;
    }
    .table-wrap h2 {
      padding: 18px 22px 14px; font-size: 15px;
      font-weight: 700; margin: 0; border-bottom: 1px solid #f0f0f0;
      color: #1a1a2e;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      background: #f8f9fb; padding: 10px 14px;
      font-size: 12px; color: #888; font-weight: 600;
      text-align: left; border-bottom: 1px solid #eee;
    }
    td {
      padding: 11px 14px; font-size: 13px; color: #333;
      border-bottom: 1px solid #f3f3f3; vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafbff; }
    .badge {
      display: inline-block; padding: 2px 8px;
      border-radius: 12px; font-size: 11px; font-weight: 600;
    }
    .badge-morning { background: #fff3cd; color: #856404; }
    .badge-lunch   { background: #d1e7dd; color: #0a5c36; }
    .badge-evening { background: #d3d3f4; color: #3b3b8e; }
    .btn-preview {
      background: none; border: 1px solid #d0d0d0;
      border-radius: 6px; padding: 3px 10px;
      font-size: 11px; cursor: pointer; color: #555;
    }
    .btn-preview:hover { background: #f0f5ff; border-color: #4f8ef7; color: #4f8ef7; }

    /* ── 미리보기 모달 ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff; border-radius: 16px;
      width: 680px; max-height: 80vh; overflow-y: auto;
      padding: 28px 32px; position: relative;
    }
    .modal-close {
      position: absolute; top: 16px; right: 20px;
      background: none; border: none; font-size: 22px;
      cursor: pointer; color: #888;
    }
    .modal h3 { margin: 0 0 16px; font-size: 17px; color: #1a1a2e; }
    .modal-meta { background: #f8f9fb; border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; font-size: 13px; line-height: 1.8; }
    .modal-content { font-size: 14px; line-height: 1.9; color: #333; white-space: pre-wrap; }
    .img-marker { display: inline-block; background: #e8f0fe; color: #4f8ef7; border-radius: 6px; padding: 2px 10px; font-size: 12px; margin: 8px 0; }

    /* ── 하단 실행 영역 ── */
    .action-bar {
      background: #fff; border-radius: 14px;
      padding: 22px 26px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .action-bar h3 { margin: 0 0 14px; font-size: 15px; font-weight: 700; color: #1a1a2e; }
    .options-row { display: flex; gap: 24px; margin-bottom: 18px; flex-wrap: wrap; }
    .opt-group { display: flex; flex-direction: column; gap: 4px; }
    .opt-group label { font-size: 12px; color: #888; font-weight: 600; }
    .opt-group input[type="number"] {
      width: 80px; padding: 7px 10px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 13px;
    }
    .btn-start {
      width: 100%; padding: 14px; background: #4f8ef7;
      color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: background .2s;
    }
    .btn-start:hover:not(:disabled) { background: #3a7de0; }
    .btn-start:disabled { background: #b0c4de; cursor: not-allowed; }

    /* ── 진행 영역 ── */
    .progress-wrap {
      display: none; margin-top: 18px;
    }
    .progress-wrap.show { display: block; }
    .progress-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
    .progress-bar-bg { background: #e9ecef; border-radius: 8px; height: 12px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: #4f8ef7; border-radius: 8px; transition: width .4s; width: 0%; }
    .progress-log {
      margin-top: 12px; background: #1a1a2e; border-radius: 8px;
      padding: 12px 16px; height: 140px; overflow-y: auto;
      font-family: monospace; font-size: 12px; color: #a8d8a8;
    }
    .log-err { color: #ff7b7b; }
    .log-info { color: #aad4f5; }
  </style>
</head>
<body>

<div class="top-bar">
  <button class="btn-back" onclick="api.navigate('dashboard')">←</button>
  <h1>📅 일괄 예약 발행</h1>
</div>

<div class="container">

  <!-- 업로드 영역 -->
  <div class="upload-zone" id="upload-zone">
    <div class="icon">📄</div>
    <strong>글 파일을 여기에 드래그하거나 버튼을 클릭하세요</strong>
    <p>지원 형식: .txt / .md &nbsp;|&nbsp; ===글시작=== / ===글끝=== 형식</p>
    <button class="btn-upload" onclick="document.getElementById('file-input').click()">파일 선택</button>
    <input type="file" id="file-input" accept=".txt,.md">
  </div>

  <!-- 요약 카드 (파싱 후 표시) -->
  <div class="summary-bar" id="summary-bar" style="display:none">
    <div class="summary-card">
      <div class="num" id="sum-total">0</div>
      <div class="label">총 글 수</div>
    </div>
    <div class="summary-card">
      <div class="num" id="sum-days">0</div>
      <div class="label">일 수</div>
    </div>
    <div class="summary-card">
      <div class="num" id="sum-from">-</div>
      <div class="label">시작일</div>
    </div>
    <div class="summary-card">
      <div class="num" id="sum-to">-</div>
      <div class="label">마지막일</div>
    </div>
  </div>

  <!-- 글 목록 테이블 -->
  <div class="table-wrap" id="table-wrap" style="display:none">
    <h2>📋 글 목록</h2>
    <table>
      <thead>
        <tr>
          <th style="width:36px">#</th>
          <th>날짜</th>
          <th>시간</th>
          <th>슬롯</th>
          <th>카테고리</th>
          <th>제목</th>
          <th style="width:60px"></th>
        </tr>
      </thead>
      <tbody id="post-table-body"></tbody>
    </table>
  </div>

  <!-- 실행 영역 -->
  <div class="action-bar" id="action-bar" style="display:none">
    <h3>⚙️ 예약 등록 설정</h3>
    <div class="options-row">
      <div class="opt-group">
        <label>글 입력 간 대기 (초)</label>
        <input type="number" id="opt-delay" value="3" min="2" max="10">
      </div>
      <div class="opt-group">
        <label>시작 번호 (중단 후 재개)</label>
        <input type="number" id="opt-start-from" value="1" min="1">
      </div>
    </div>
    <button class="btn-start" id="btn-start" onclick="startBulk()">
      전체 예약 등록 시작
    </button>
    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-header">
        <span id="prog-text">0 / 0</span>
        <span id="prog-pct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="prog-bar"></div>
      </div>
      <div class="progress-log" id="prog-log"></div>
    </div>
  </div>

</div>

<!-- 미리보기 모달 -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h3 id="modal-title"></h3>
    <div class="modal-meta" id="modal-meta"></div>
    <div class="modal-content" id="modal-content"></div>
  </div>
</div>

<script src="js/bulk-schedule.js"></script>
</body>
</html>
